name: graduation_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  camera: ^0.11.0+2
  camera_windows: ^0.2.5
  http: ^1.2.1
  path_provider: ^2.1.3

  # Database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
